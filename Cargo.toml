[package]
name = "Stick"
version = "4.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.29.0", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
zstd = "0.13"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rayon = "1.10"
roxmltree = "0.20"
rodio = "0.19"
rfd = "0.15"
image = "0.25"
tiny-skia = "0.11"
earcutr = "0.5"
ureq = { version = "2.10", features = ["json"] }
arabic_reshaper = "0.3"
unicode-bidi = "0.3"
fontdue = "0.9"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
anyhow = { version = "1.0", optional = true }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"], optional = true }
iroh = { version = "1.4.1", optional = true }

[features]
remote-bridge = ["dep:anyhow", "dep:tokio", "dep:iroh"]
radmin-assistant = []

[[bin]]
name = "StickOnlineBridge"
path = "src/bin/stick_online_bridge.rs"
required-features = ["remote-bridge"]

[[bin]]
name = "StickRadminAssistant"
path = "src/bin/stick_radmin_assistant.rs"
required-features = ["radmin-assistant"]


[build-dependencies]
winres = "0.1"
image = "0.25"
