name: Build and Release AniHady2D
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release EXE
        run: cargo build --release
      - name: Package Clean Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/AniHady2D.exe dist/
          if (Test-Path assets) { Copy-Item -Recurse assets dist/assets }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniHady2D-Windows
          path: dist/
      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: AniHady2D v1.1.${{ github.run_number }}
          files: dist/AniHady2D.exe
