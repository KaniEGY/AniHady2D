name: Build and Release AniHady2D
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release EXE
        run: cargo build --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniHady2D-Windows
          path: |
            target/release/AniHady2D.exe
            assets/
      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AniHady2D v1.0.${{ github.run_number }}
          files: target/release/AniHady2D.exe
