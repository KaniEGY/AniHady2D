name: Build and Release Stick

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Compatibility & Unit Tests
        run: cargo test

      - name: Build Release EXE
        run: cargo build --release

      - name: Extract Unified APP_VERSION from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Clean Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/Stick.exe dist/Stick.exe
          "${{ steps.meta.outputs.version }}" | Out-File -FilePath dist/version.txt -Encoding ascii -NoNewline

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stick-Windows
          path: dist/

      - name: Publish Direct Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}.${{ github.run_number }}
          name: Stick v${{ steps.meta.outputs.version }} (Build ${{ github.run_number }})
          files: |
            dist/Stick.exe
            dist/version.txt
